server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  # AI calls (local or cloud models) legitimately take minutes; everything else keeps a tight timeout.
  location /api/v1/intelligence/ { proxy_pass http://backend:8000; proxy_read_timeout 600s; proxy_send_timeout 600s; }
  location /api/ { proxy_pass http://backend:8000; proxy_read_timeout 30s; }
  location / { try_files $uri /index.html; }
}
