name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: aerosec
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aerosec
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aerosec -d aerosec"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Throwaway CI database. Tests create and migrate an isolated "<db>_test" database themselves.
      DATABASE_URL: postgresql+psycopg://aerosec:ci-only-password@localhost:5432/aerosec
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: bandit -q -r app
      - run: pip-audit -r requirements.txt
      - run: alembic upgrade head
      - run: alembic check
      # Real-data regression tests skip automatically when the datasets are absent.
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
