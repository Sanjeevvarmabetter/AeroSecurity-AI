services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: aerosec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aerosec
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerosec -d aerosec"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://aerosec:${POSTGRES_PASSWORD}@db:5432/aerosec
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_TOKEN_VIEWER: ${API_TOKEN_VIEWER:-}
      API_TOKEN_ANALYST: ${API_TOKEN_ANALYST:-}
      API_TOKEN_ADMIN: ${API_TOKEN_ADMIN:-}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      OPENSKY_MIN_INTERVAL_S: ${OPENSKY_MIN_INTERVAL_S:-10}
      AI_TIMEOUT_S: ${AI_TIMEOUT_S:-120}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1800}
      CORS_ORIGINS: '["http://localhost:${FRONTEND_HOST_PORT:-8080}","http://localhost:5173"]'
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach a host-side Ollama
    volumes:
      - ./datasets:/srv/datasets:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:8080"

volumes:
  pgdata:
